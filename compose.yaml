version: "3.9"
services:
  changemanagementdb:
    image: postgres:latest
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=change_management
      - POSTGRES_USER=postgres
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  changemanagementapp:
    build:
      context: .
      target: development
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://changemanagementdb:5432/change_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      changemanagementdb:
        condition: service_healthy
volumes:
  pg-data: